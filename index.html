function render(){var d=draft(),s='',v,i,p,r;if(tab==='explore'){if(d.phase==='setup'){s='<h2>Find what connects.</h2><p>Start with three ambitions. Explore their connections, then repeat.</p><section><label for="period">Time horizon</label><select id="period">'+['Next week','Next month','Next 3 months','Next year','Open-ended'].map(function(x){return '<option '+(d.period===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select>'+diagram(d.goals,[],-1)+d.goals.map(function(x,i){return field('goal'+i,'Goal '+(i+1),x,'Something I want to accomplish…')}).join('')+button('Begin experiment →','begin')+'</section>'}else if(d.phase==='round'){v=vertices(d);i=d.answers.length;p=pairs[i];s='<small>Round '+(d.rounds.length+1)+' · Connection '+(i+1)+' of 3</small><section>'+diagram(v,d.answers,i)+'<h2>'+esc(v[p[0]])+' ↔ '+esc(v[p[1]])+'</h2><p>What is the connecting fabric between these two? How do they relate or enable one another?</p>'+field('pending','Your thoughts',d.pending,'Think out loud. Repetition is welcome.')+button('Continue →','answer')+button('Go back','back',true)+'</section>'}else if(d.phase==='label'){s='<section><h2>Name this connection.</h2><p>'+esc(d.pending)+'</p>'+field('short','Short connecting phrase',d.short)+button('Lock in connection →','lock')+button('Edit original answer','edit',true)+'</section>'}else if(d.phase==='review'){r=d.rounds[d.rounds.length-1];s='<small>Round '+d.rounds.length+' complete</small><section><h2>Look at what emerged.</h2>'+diagram(r.vertices,r.answers,-1)+r.answers.map(function(a,i){return '<div class="entry"><small>Connection '+(i+1)+'</small><br><b>'+esc(a.label)+'</b><br>'+esc(a.raw)+'</div>'}).join('')+button('Generate next triangle →','next')+button('Finish and reflect','reflect',true)+'</section>'}else{s='<section><h2>What did you discover?</h2>'+field('insight','Your common thread',d.insight)+field('action','One action to test',d.action)+field('tags','Themes (comma separated)',d.tags,'Freedom, focus, connection…')+but document.addEventListener('input',function(e){var t=e.target,d=draft(),id=t.id||'';if(/^goal[0-2]$/.test(id))d.goals[Number(id.slice(4))]=t.value;else if(['period','pending','short','insight','action','tags'].indexOf(id)>=0)d[id]=t.value;else if(t.dataset&&t.dataset.outcome){db.entries.forEach(function(x){if(x.id===t.dataset.outcome){x.outcome=t.value;x.followup=new Date().toISOString()}})}save()});
