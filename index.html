<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Common Thread</title><style>
:root{color-scheme:light;--ink:#082b48;--blue:#006eae;--teal:#007e87;--paper:#f3f6f8;--line:#d6e0e7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}main{max-width:790px;margin:auto;padding:0 26px 55px}header{background:#082b48;color:white;margin:0 -26px 38px;padding:26px 26px 19px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;border-bottom:4px solid #00a0b0}h1{font:400 30px/1.1 Georgia,serif;letter-spacing:-1.2px;margin:0}h1:after{content:"A PRACTICE IN CLARITY";display:block;font:600 9px/1.5 system-ui,sans-serif;letter-spacing:2.5px;color:#a7c9db;margin-top:8px}h2{font:400 clamp(30px,6vw,48px)/1.08 Georgia,"Times New Roman",serif;letter-spacing:-1.5px;margin:14px 0 18px;overflow-wrap:anywhere}h3{font:400 25px/1.2 Georgia,serif;letter-spacing:-.4px;margin:8px 0 16px}p{margin:10px 0 20px}nav{display:flex;gap:5px}button,input,textarea,select{font:inherit}button{border:1px solid transparent;border-radius:3px;padding:14px 18px;background:#006da6;color:white;font-weight:650;cursor:pointer;min-height:48px;transition:background .2s,transform .2s}button:hover{background:#004f7e}button:active{transform:translateY(1px)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #20a9bb;outline-offset:3px}nav button{background:transparent;color:#c8dce8;font-size:13px;padding:8px 12px;min-height:44px;border-bottom:2px solid transparent}nav button:hover,nav button[aria-current="page"]{background:#123b59;color:white;border-bottom-color:#35c2d0}.secondary{background:transparent;color:#006da6;border:1px solid #b5ccd9}.secondary:hover{background:#e5eff5;color:#082b48}section{background:white;border:1px solid var(--line);border-radius:4px;padding:clamp(20px,5vw,38px);margin:20px 0;box-shadow:0 8px 26px #082b4807}section:has(svg){border-top:3px solid #007e87}label{display:block;font-weight:650;font-size:13px;letter-spacing:.3px;margin:22px 0 7px}textarea,input,select{width:100%;border:1px solid #b8cbd7;border-radius:3px;background:#f8fafb;color:inherit;padding:14px;font-size:16px}textarea{min-height:105px;resize:vertical}textarea::placeholder{color:#647b8b}.full{width:100%;margin-top:14px}small,.muted,footer{color:#526b7c}small{font-size:12px;letter-spacing:.3px}#app>small{display:block;text-transform:uppercase;letter-spacing:1.8px;font-weight:700;color:#007e87}svg{width:100%;max-width:420px;height:auto;display:block;margin:12px auto 24px;background:radial-gradient(ellipse at center,#eaf2f5 0%,transparent 72%)}.row{display:flex;gap:24px;flex-wrap:wrap}.row>div{flex:1}.stat{font:400 46px/1 Georgia,serif;color:#006da6}.entry{border-bottom:1px solid #dfe7ed;padding:16px 0;overflow-wrap:anywhere}.entry:last-child{border-bottom:0}.bar{height:5px;background:#e3edf2;border-radius:0;overflow:hidden;margin-top:8px}.bar i{display:block;background:linear-gradient(90deg,#006da6,#00a0a0);height:100%}summary{cursor:pointer;font-weight:650;color:#006da6}footer{font-size:12px;margin-top:36px;border-top:1px solid #c9d8e1;padding-top:17px}#notice{color:#9b3628}#notice:empty{display:none}#app>h2:before{content:"COMMON THREAD / PERSONAL STRATEGY";display:block;font:700 10px/1.5 system-ui,sans-serif;letter-spacing:2px;color:#007e87;margin-bottom:14px}@media(max-width:520px){main{padding:0 16px 40px}header{margin:0 -16px 28px;padding:23px 16px 12px;gap:12px}nav{width:100%;justify-content:space-between}nav button{flex:1}section{padding:20px}h1{font-size:29px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><h1>◬ common thread.</h1><nav><button data-tab="explore">Explore</button><button data-tab="journal">Journal</button><button data-tab="patterns">Patterns</button></nav></header><p id="notice" role="alert"></p><div id="app"><p>Loading Common Thread…</p><noscript>JavaScript is required. Open this page in Safari or Chrome.</noscript></div><footer>Private by design. Journal entries are saved in this browser only. Export a backup to preserve them.</footer></main><script>
(function(){'use strict';
var key='common-thread-v2',db={entries:[],draft:null},tab='explore',app=document.getElementById('app'),notice=document.getElementById('notice'),pairs=[[0,1],[1,2],[2,0]];
function warn(s){notice.textContent=s}try{var raw=localStorage.getItem(key);if(raw){var old=JSON.parse(raw);if(Array.isArray(old.entries))db=old}}catch(e){warn('Browser storage is unavailable. Export before leaving.')}
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){warn('Browser storage is unavailable. Export before leaving.')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fresh(){return{id:String(Date.now())+'-'+Math.random().toString(36).slice(2),created:new Date().toISOString(),period:'Next 3 months',goals:['','',''],rounds:[],answers:[],pending:'',short:'',insight:'',action:'',tags:'',phase:'setup'}}
function draft(){if(!db.draft)db.draft=fresh();return db.draft}
function vertices(d){return d.rounds.length?d.rounds[d.rounds.length-1].answers.map(function(a){return a.label}):d.goals}
function button(t,a,secondary){return '<button class="full '+(secondary?'secondary':'')+'" data-action="'+a+'">'+t+'</button>'}
function field(id,label,v,ph){return '<label for="'+id+'">'+label+'</label><textarea id="'+id+'" placeholder="'+esc(ph||'')+'">'+esc(v)+'</textarea>'}
function date(s){return new Date(s).toLocaleString()}
function diagram(v,ans,active){var p=[[160,28],[40,210],[280,210]],m=[[100,119],[160,210],[220,119]],s='<svg viewBox="0 0 320 240" role="img" aria-label="Triangle of goals"><path d="M160 28 L40 210 L280 210 Z" fill="none" stroke="#a0ada2" stroke-width="2"/>';pairs.forEach(function(a,i){s+='<path d="M'+p[a[0]].join(' ')+' L'+p[a[1]].join(' ')+'" stroke="'+(ans[i]?'#007e87':active===i?'#b47d36':'transparent')+'" stroke-width="3"/>'});p.forEach(function(a,i){s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="21" fill="'+['#176b9c','#b47d36','#007e87'][i]+'"/><text x="'+a[0]+'" y="'+(a[1]+5)+'" fill="white" text-anchor="middle" font-size="14">'+ 'ABC'[i]+'</text>'});m.forEach(function(a,i){s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="14" fill="'+(ans[i]?'#007e87':active===i?'#b47d36':'#aab8ae')+'"/><text x="'+a[0]+'" y="'+(a[1]+4)+'" text-anchor="middle" fill="white" font-size="12">'+(ans[i]?'✓':i+1)+'</text>'});s+='<text x="160" y="157" text-anchor="middle" font-size="10" letter-spacing="2" fill="currentColor">COMMON THREAD</text></svg>';return s+v.map(function(x,i){return '<div><b>'+'ABC'[i]+'.</b> '+esc(x||'Your goal')+'</div>'}).join('')}
function history(d){return d.rounds.map(function(r,i){return '<details class="entry"><summary>Round '+(i+1)+'</summary>'+r.answers.map(function(a,j){return '<p><small>'+esc(r.vertices[pairs[j][0]])+' ↔ '+esc(r.vertices[pairs[j][1]])+'</small><br><b>'+esc(a.label)+'</b><br>'+esc(a.raw)+'</p>'}).join('')+'</details>'}).join('')}
function bar(t,n,max){return '<div class="entry">'+esc(t)+' <b style="float:right">'+n+'</b><div class="bar"><i style="width:'+(max?100*n/max:0)+'%"></i></div></div>'}
function render(){var d=draft(),s='',v,i,p,r;if(tab==='explore'){if(d.phase==='setup'){s='<h2>Find what connects.</h2><p>Start with three ambitions. Explore their connections, then repeat.</p><section><label for="period">Time horizon</label><select id="period">'+['Next week','Next month','Next 3 months','Next year','Open-ended'].map(function(x){return '<option '+(d.period===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select>'+diagram(d.goals,[],-1)+d.goals.map(function(x,i){return field('goal'+i,'Goal '+(i+1),x,'Something I want to accomplish…')}).join('')+button('Begin experiment →','begin')+'</section>'}else if(d.phase==='round'){v=vertices(d);i=d.answers.length;p=pairs[i];s='<small>Round '+(d.rounds.length+1)+' · Connection '+(i+1)+' of 3</small><section>'+diagram(v,d.answers,i)+'<h2>'+esc(v[p[0]])+' ↔ '+esc(v[p[1]])+'</h2><p>What is the connecting fabric between these two? How do they relate or enable one another?</p>'+field('pending','Your thoughts',d.pending,'Think out loud. Repetition is welcome.')+button('Continue →','answer')+button('Go back','back',true)+'</section>'}else if(d.phase==='label'){s='<section><h2>Name this connection.</h2><p>'+esc(d.pending)+'</p>'+field('short','Short connecting phrase',d.short)+button('Lock in connection →','lock')+button('Edit original answer','edit',true)+'</section>'}else if(d.phase==='review'){r=d.rounds[d.rounds.length-1];s='<small>Round '+d.rounds.length+' complete</small><section><h2>Look at what emerged.</h2>'+diagram(r.vertices,r.answers,-1)+r.answers.map(function(a,i){return '<div class="entry"><small>Connection '+(i+1)+'</small><br><b>'+esc(a.label)+'</b><br>'+esc(a.raw)+'</div>'}).join('')+button('Generate next triangle →','next')+button('Finish and reflect','reflect',true)+'</section>'}else{s='<section><h2>What did you discover?</h2>'+field('insight','Your common thread',d.insight)+field('action','One action to test',d.action)+field('tags','Themes (comma separated)',d.tags,'Freedom, focus, connection…')+button('Save to journal','finish')+button('Continue exploring','next',true)+'</section>'}if(d.rounds.length)s+='<section><h3>Experiment history</h3>'+history(d)+'</section>'}else if(tab==='journal'){s='<h2>Your journal</h2><section>'+(db.entries.length?db.entries.slice().reverse().map(function(e){return '<div class="entry"><small>'+esc(date(e.completed))+' · '+esc(e.period)+'</small><h3>'+esc(e.goals.join(' · '))+'</h3><p>'+esc(e.insight)+'</p>'+history(e)+'<p><b>Action:</b> '+esc(e.action||'Not specified')+'</p><label>Outcome / follow-up</label><textarea data-outcome="'+esc(e.id)+'">'+esc(e.outcome||'')+'</textarea><small>'+esc(e.followup?date(e.followup):'')+'</small></div>'}).join(''):'No completed experiments yet.')+'</section>'+button('Export journal & draft','export',true)+'<label for="import">Restore backup</label><input id="import" type="file" accept=".json,application/json">'}else{var labels=[],tags={},words={},stop=' a an the and or to of in for is it that this with be on as my i we you are was will can would could should more have having just so at from by me they them their not do doing what how between about into which than ';db.entries.forEach(function(e){var seen={};(e.tags||'').split(',').forEach(function(t){t=t.trim().toLowerCase();if(t&&!seen[t]){seen[t]=1;tags[t]=(tags[t]||0)+1}});e.rounds.forEach(function(r){r.answers.forEach(function(a){labels.push(a.label)})})});labels.forEach(function(l){var seen={};(l.toLowerCase().match(/[a-z0-9]+/g)||[]).forEach(function(w){if(w.length>2&&stop.indexOf(' '+w+' ')<0&&!seen[w]){seen[w]=1;words[w]=(words[w]||0)+1}})});function ranked(o,max){return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,12).map(function(t){return bar(t,o[t],max)}).join('')};s='<h2>Patterns over time</h2><section class="row"><div><div class="stat">'+db.entries.length+'</div><small>Experiments</small></div><div><div class="stat">'+labels.length+'</div><small>Connections</small></div></section><section><h3>Recurring themes</h3><p class="muted">Your own theme tags, once per experiment.</p>'+(ranked(tags,db.entries.length)||'Add themes when finishing an experiment.')+'</section><section><h3>Repeated words</h3><p class="muted">Literal repetition, not semantic AI analysis.</p>'+(ranked(words,labels.length)||'Complete an experiment to see patterns.')+'</section><section><h3>Convergence over time</h3>'+ (db.entries.map(function(e){var a=[];e.rounds.forEach(function(r){r.answers.forEach(function(x){a.push(x.label.trim().toLowerCase())})});return '<div class="entry"><small>'+esc(date(e.completed))+'</small><br>'+e.rounds.length+' rounds · '+(a.length-a.filter(function(x,i){return a.indexOf(x)===i}).length)+' exact repeated labels</div>'}).join('')||'No data yet.')+'</section>'}app.innerHTML=s;document.querySelectorAll('nav button').forEach(function(b){if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});save()}
document.addEventListener('input',function(e){var t=e.target,d=draft(),id=t.id||'';if(/^goal[0-2]$/.test(id))d.goals[Number(id.slice(4))]=t.value;else if(['period','pending','short','insight','action','tags'].indexOf(id)>=0)d[id]=t.value;else if(t.dataset&&t.dataset.outcome){db.entries.forEach(function(x){if(x.id===t.dataset.outcome){x.outcome=t.value;x.followup=new Date().toISOString()}})}save()});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='period'){draft().period=t.value;save()}if(t.id==='import'&&t.files[0]){var reader=new FileReader();reader.onload=function(){try{var x=JSON.parse(reader.result);if(x.version!==2||!x.data||!Array.isArray(x.data.entries)||!x.data.entries.every(function(e){return e&&Array.isArray(e.goals)&&Array.isArray(e.rounds)}))throw Error('Invalid');if(confirm('Replace your current journal with this backup?')){db=x.data;save();render()}}catch(err){warn('Invalid backup file.')}};reader.readAsText(t.files[0])}});
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;warn('');if(b.dataset.tab){tab=b.dataset.tab;render();return}var d=draft(),a=b.dataset.action;if(a==='begin'){if(!d.goals.every(function(x){return x.trim()}))return warn('Enter all three goals.');d.phase='round'}else if(a==='answer'){if(!d.pending.trim())return warn('Enter a connection first.');d.short=d.pending;d.phase='label'}else if(a==='edit'){d.phase='round'}else if(a==='lock'){if(!d.short.trim())return warn('Enter a connecting phrase.');d.answers.push({raw:d.pending.trim(),label:d.short.trim()});d.pending='';d.short='';if(d.answers.length===3){d.rounds.push({vertices:vertices(d).slice(),answers:d.answers,completed:new Date().toISOString()});d.answers=[];d.phase='review'}else d.phase='round'}else if(a==='back'){if(d.answers.length){var p=d.answers.pop();d.pending=p.raw;d.short=p.label;d.phase='label'}else d.phase=d.rounds.length?'review':'setup'}else if(a==='next')d.phase='round';else if(a==='reflect')d.phase='reflect';else if(a==='finish'){d.completed=new Date().toISOString();db.entries.push(d);db.draft=null;tab='journal'}else if(a==='export'){var url=URL.createObjectURL(new Blob([JSON.stringify({version:2,data:db},null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='common-thread-backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);return}save();render();window.scrollTo(0,0)});try{render()}catch(e){warn('Common Thread could not initialize: '+e.message)}
})();
</script></body></html>
